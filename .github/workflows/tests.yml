
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest

    env:
      BOT_TOKEN: "123456:TEST_TOKEN"
      GEMINI_API_KEY: "test-gemini-api-key"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m unittest test_financial_actions test_budget_scheduler test_budget_scheduler_full test_budget_month_reset test_budget_notifications test_budget_thresholds test_ai_handler -v
